<!doctype html>
<!--
  صفحة 404 — [QIM-WEB-HOTFIX-002]

  وجودها **شرط تقني** لا زينة: بدون `404.html` في الجذر يفترض Cloudflare Pages أن
  المشروع SPA ويعيد «/» لكل مسار غير مطابق — أي يعيد نفس العطل الذي أُصلح في
  `_redirects` (أصل مفقود يعود HTML بحالة 200 فيُقرأ وحدةَ JS فيفشل بخطأ MIME).

  ولذلك تبقى هذه الصفحة **ساكنة تمامًا**: لا سكربت (سياسة CSP تمنع inline script
  أصلًا)، ولا استيراد حِزم — كي لا تعتمد صفحةُ الفشل على ما قد يكون هو الفاشل.
-->
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>الصفحة غير موجودة — قِمّة</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: #efeae2;
        color: #2b2723;
        font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
        line-height: 1.7;
      }
      main { max-width: 26rem; text-align: center; }
      .code { font-size: 3rem; font-weight: 900; letter-spacing: -0.02em; margin: 0; }
      h1 { font-size: 1.15rem; font-weight: 800; margin: 0.5rem 0 0; }
      p { font-size: 0.9rem; margin: 0.75rem 0 0; color: #5d564e; }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        margin-top: 1.5rem;
        padding: 0 1.5rem;
        border-radius: 999px;
        background: #2b2723;
        color: #efeae2;
        font-weight: 700;
        font-size: 0.95rem;
        text-decoration: none;
      }
      .en { margin-top: 1.75rem; font-size: 0.8rem; color: #7a7169; }
      @media (prefers-color-scheme: dark) {
        body { background: #1a1816; color: #f1eee8; }
        p { color: #a49b91; }
        a { background: #f1eee8; color: #1a1816; }
        .en { color: #8b8279; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">٤٠٤</p>
      <h1>ما لقينا هذي الصفحة</h1>
      <p>يمكن الرابط قديم أو فيه غلطة إملائية. بياناتك محفوظة على جهازك وما تأثّرت.</p>
      <a href="/">ارجع لقِمّة</a>
      <p class="en" lang="en" dir="ltr">Page not found — your data is safe on your device.</p>
    </main>
  </body>
</html>
