<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" font-family="system-ui, sans-serif" font-size="12">
  <rect width="1000" height="420" fill="#fff"/>
  <text x="20" y="28" font-size="18" font-weight="bold">Water Guardian — physical validation rig (Phase 7)</text>
  <text x="20" y="48" fill="#555">Gravity or mains-fed loop. Reference = timed gravimetric collection (scale, 1 g) — independent of the meter under test.</text>
  <!-- header tank -->
  <rect x="40" y="80" width="120" height="140" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><rect x="42" y="110" width="116" height="108" fill="#7dd3fc"/>
  <text x="100" y="72" text-anchor="middle" font-weight="bold">Header tank 20 L</text><text x="100" y="240" text-anchor="middle" fill="#555">≥1.5 m head (or mains tap)</text>
  <!-- pipe -->
  <rect x="160" y="150" width="620" height="22" fill="#94a3b8"/><rect x="160" y="156" width="620" height="10" fill="#7dd3fc"/>
  <text x="470" y="140" text-anchor="middle">Test pipe: PPR 25 mm PN20 (ID ≈ 16.6) and 32 mm (ID ≈ 21.2) — also try 1" GI for comparison</text>
  <!-- straight run markers -->
  <line x1="200" y1="185" x2="470" y2="185" stroke="#15803d" stroke-width="2"/><text x="335" y="200" text-anchor="middle" fill="#15803d">≥10 D upstream straight (170–210 mm)</text>
  <line x1="560" y1="185" x2="700" y2="185" stroke="#15803d" stroke-width="2"/><text x="630" y="200" text-anchor="middle" fill="#15803d">≥5 D downstream</text>
  <!-- transducers -->
  <rect x="470" y="128" width="36" height="22" fill="#1d4ed8"/><rect x="524" y="128" width="36" height="22" fill="#1d4ed8"/>
  <text x="515" y="120" text-anchor="middle" fill="#1d4ed8" font-weight="bold">TS-2 pair, V-method, on the SIDE of the pipe</text>
  <!-- inlet valve -->
  <rect x="170" y="140" width="20" height="42" fill="#fbbf24" stroke="#b45309"/><text x="180" y="215" text-anchor="middle" font-size="11">isolation valve</text>
  <!-- outlet needle valve -->
  <rect x="720" y="140" width="20" height="42" fill="#fbbf24" stroke="#b45309"/><text x="730" y="215" text-anchor="middle" font-size="11">flow-setting valve</text>
  <text x="730" y="228" text-anchor="middle" font-size="11">(needle/ball, sets 0.25–5 L/min)</text>
  <!-- collection -->
  <path d="M780 161 L820 161 L820 260" fill="none" stroke="#7dd3fc" stroke-width="6"/>
  <rect x="790" y="260" width="60" height="70" fill="#e0f2fe" stroke="#0369a1"/><text x="820" y="350" text-anchor="middle">2 L jug</text>
  <rect x="775" y="335" width="90" height="12" fill="#d1d5db" stroke="#374151"/><text x="820" y="365" text-anchor="middle">scale 5 kg / 1 g</text>
  <text x="820" y="380" text-anchor="middle" fill="#555" font-size="11">+ stopwatch → L/min</text>
  <!-- air bleed -->
  <circle cx="680" cy="145" r="6" fill="#fff" stroke="#333"/><text x="680" y="132" text-anchor="middle" font-size="11">air bleed (keep pipe FULL)</text>
  <!-- electronics -->
  <rect x="440" y="250" width="150" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8"/><text x="515" y="275" text-anchor="middle" font-weight="bold">TUF-2000M + ESP32</text><text x="515" y="293" text-anchor="middle">log flow, Q, strength, ratio</text>
  <line x1="515" y1="150" x2="515" y2="250" stroke="#1d4ed8" stroke-dasharray="4 3"/>
  <!-- key rules -->
  <text x="40" y="300" font-weight="bold">Rules of the rig</text>
  <text x="40" y="318">1. Pipe completely full; outlet above the transducer level so the section never drains.</text>
  <text x="40" y="334">2. Zero calibration (M42) with BOTH valves shut and water still; solidify with M26.</text>
  <text x="40" y="350">3. Each rung: 3 timed collections (≥60 s or ≥1 L); each mounting: remove, re-couple, re-clamp — 5 mountings.</text>
  <text x="40" y="366">4. Record Q, strength up/down, M91 ratio, working step at every reading. A reading with Q &lt; 60 is logged as INVALID, not as a number.</text>
  <text x="40" y="382">5. Disturbance trials: tap the pipe, open/close a downstream tap briefly, drain to half-full — count false incidents.</text>
  <text x="40" y="405" fill="#b91c1c">Pass targets (ours, not a standard): ≥19/20 detections at the declared threshold; ≤1 false incident in 40 mixed trials.</text>
</svg>
