; Water Guardian — ESP32 firmware prototype (PlatformIO)
; Board: generic ESP32 DevKit (the board you already own). Adjust `board` if needed.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=1
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
; Modbus RTU master is implemented in-tree (src/modbus_rtu.*) with CRC16 — no external
; Modbus library, so the exact framing/timeouts are visible and testable.

; Host-side unit tests of the rule engine + CRC + REAL4 decoding (no hardware):
;   pio test -e native
[env:native]
platform = native
build_flags = -std=c++17 -DNATIVE_TEST
test_build_src = yes
build_src_filter = +<rule_engine.cpp> +<modbus_rtu.cpp> +<tuf2000m.cpp>
