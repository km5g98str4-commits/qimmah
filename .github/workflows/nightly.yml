name: Nightly

# Scheduled full drift check on the TRUNK. Re-runs the same deterministic gate as
# ci.yml (so a dependency bump, a force-push, or an environment change that breaks
# the build is caught even without a new push), plus a NON-BLOCKING best-effort
# pass of the browser proofs for visibility.
#
# [CTO-71] — scope narrowed to `main` only. This workflow used to run the gate on
# `integration/wave3` and `integration/wave4`. Its first-ever scheduled run went RED
# on `integration/wave3` — last touched 2026-07-13, three weeks stale — failing the
# lazy-chunk perf budget (NutritionView 151.6KB vs a 130KB ceiling). That red says
# nothing about the trunk and cannot be fixed without reviving an abandoned branch.
# Owner decision: archive the scope, keep both branches (NOT deleted, still on the
# remote, still checkoutable). Drift on the trunk is what this gate is for.
#
# NOTE: GitHub only fires `schedule` from the workflow file on the repository's
# DEFAULT branch (main). This file therefore starts running nightly once it lands
# on main; until then, trigger it manually with "Run workflow" (workflow_dispatch).

on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC daily
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/ref to run the gate on (manual runs)'
        required: false
        default: 'main'

permissions:
  contents: read

jobs:
  drift-gate:
    name: Drift gate — ${{ matrix.ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ref: [main]
    steps:
      - name: Checkout ${{ github.event.inputs.ref || matrix.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || matrix.ref }}

      - name: Setup Node 22 (+ npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b --noEmit

      - name: Lint (--max-warnings 0)
        run: npx eslint . --ext ts,tsx --report-unused-disable-directives --max-warnings 0

      # [RELEASE-REVIEW] نفس خطوة CI حرفيًّا: `npm run build` يشغّل ensure-search-assets
      # قبل vite build فيولّد public/food/search/ (غير ملتزَم). النداء المباشر لـvite
      # كان يترك حزم البحث غائبة، فسقط test:search-quality ليلًا وهو أخضر في CI.
      - name: Production build
        run: npm run build

      - name: Perf budget (informational, non-gating)
        continue-on-error: true
        run: node scripts/check-perf-budget.mjs

      - name: Full deterministic test gate
        run: npm run test:gate

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Onboarding v2 browser E2E
        run: npm run test:e2e:onboarding

  browser-proofs:
    name: Browser proofs (best-effort, non-gating)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true # informational only — never blocks
    steps:
      # [CTO-71] — كان يفحص `integration/wave4`؛ صار على الجذع مثل بوابة الانحراف.
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node 22 (+ npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Production build (needed by browser proofs)
        run: npx tsc -b && npx vite build

      # These need a real browser and may also need network/preview; they are NOT
      # part of the merge gate. Guarded + continue-on-error so results are surfaced
      # without ever gating. (Proofs needing Supabase/Docker are excluded — see
      # docs/ci/README.md.)
      - name: Browser proof runners (informational)
        run: |
          set +e
          proofs=(
            scripts/run-p10-i18n-proof.mjs
            scripts/run-p5-medals-shot.mjs
            scripts/run-p10-a5-proof.mjs
          )
          fail=0
          for s in "${proofs[@]}"; do
            [ -f "$s" ] || { echo "absent: $s"; continue; }
            echo "::group::node $s"; node "$s"; rc=$?; echo "::endgroup::"
            [ $rc -eq 0 ] && echo "PASS $s" || { echo "NON-ZERO ($rc) $s"; fail=1; }
          done
          echo "browser-proofs summary: fail=$fail (non-gating)"
