name: Supabase keep-alive

# ═══ لماذا هذا السير موجود ═══
# مشروع Supabase الإنتاجي على الخطة **المجانية**، وSupabase يوقف المشاريع المجانية
# تلقائيًّا بعد نحو **٧ أيام خمول**. والتوقّف يُسقط تسجيل الدخول تمامًا: لا سجلّ DNS
# للمشروع ⇒ `fetch` يفشل ⇒ supabase-js يضع `status = 0` ⇒ `authErrors` يصنّفه
# `network` ⇒ المستخدم يرى «ما قدرنا نتصل بالخادم. تأكّد من النت» — رسالةٌ تلوم
# اتصاله في عطلٍ ليس منه.
#
# وقع فعلًا: المشروع كان متوقّفًا والمؤسس أبلغ عن فشل الدخول (١٧ أكتوبر ٢٠٢٦).
#
# ═══ ماذا يفعل ═══
# نبضة كل ٣ أيام — داخل نافذة السبعة بهامش مريح — تولّد **نشاطًا حقيقيًّا على
# المشروع**، فلا يدخل الخمول.
#
# ═══ ولماذا نبضتان لا واحدة ═══
# `/auth/v1/health` ترد ٢٠٠ **حتى والقاعدة متوقّفة أو تُستعاد** (قيس ذلك: ردّت ٢٠٠
# بينما حالة المشروع `RESTORING` ومسار الدخول يرجع ٥٠٠). فهي وحدها **لا تثبت
# الجهوزية ولا تضمن أنها نشاط يُحتسب على القاعدة**.
# لذلك النبضة الثانية هي **مسار الدخول نفسه** ببيانات وهمية صريحة: ردّه الصحيح
# `400 invalid_credentials` يستلزم استعلام المخطّط في Postgres — أي أنه يلمس
# القاعدة فعلًا، بلا إنشاء حساب ولا بيانات حقيقية ولا أي أثر جانبي.
#
# ═══ ما لا يفعله ولماذا ═══
# • **لا يعدّل القاعدة ولا يضيف دالّة.** دالّة `keepalive()` كانت أنظف تقنيًّا، لكن
#   تطبيق هجرة على قاعدة حيّة **محجوز للمؤسس** (الميثاق §1)، فاختير مسار بلا DDL.
# • **لا يستأنف المشروع تلقائيًّا.** الاستئناف يحتاج توكن لوحة Supabase كسرّ في
#   المستودع، وذلك قرار مؤسس. فالسير **يفشل بصوت عالٍ** عند التوقّف، فيصل الإشعار
#   للمؤسس قبل أن يصل البلاغ من مستخدم.
#
# ⚠️ **قيدان يجب أن يعرفهما من يقرأ هذا:**
# ١. GitHub لا يشغّل `schedule` إلا من **الفرع الافتراضي**. فهذا الملف لا يعمل
#    آليًّا قبل أن يهبط على `main`؛ وحتى ذلك يُشغَّل يدويًّا بـ"Run workflow".
# ٢. GitHub **يوقف الجداول تلقائيًّا بعد ٦٠ يومًا من خمول المستودع**. فالحارس نفسه
#    له شرط حياة: مستودع نشط. مستودعٌ يسكن شهرين ⇒ يسكن الحارس ⇒ يسكن المشروع.

on:
  schedule:
    - cron: '17 3 */3 * *' # كل ٣ أيام، 03:17 UTC (دقيقة غير مستديرة: أقل تنافسًا على طابور GitHub)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    name: نبضة المشروع الإنتاجي
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # المفتاح والعنوان يُقرآن من **مصدر التطبيق نفسه** لا يُكتبان هنا ثانيةً:
      # نسختان تتباعدان بعد موجة، فتنبض النبضة على مشروع والتطبيق يكلّم آخر.
      # وكلتا القيمتين عامّتان بطبيعتهما (محمولتان في حزمة المتصفّح) فلا سرّ هنا.
      - name: استخراج عنوان المشروع ومفتاح anon من مصدر التطبيق
        id: cfg
        run: |
          set -euo pipefail
          SRC=src/lib/supabaseClient.ts
          URL=$(grep -oE 'https://[a-z0-9]{20}\.supabase\.co' "$SRC" | head -1)
          KEY=$(grep -oE 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.[A-Za-z0-9_.-]+' "$SRC" | head -1)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::تعذّر استخراج عنوان المشروع أو مفتاح anon من $SRC — تغيّر شكل الملف؟"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "project: $URL"

      - name: نبضة ١ — حياة الخدمة
        run: |
          set -euo pipefail
          CODE=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' \
            -H "apikey: ${{ steps.cfg.outputs.key }}" \
            "${{ steps.cfg.outputs.url }}/auth/v1/health" || true)
          CODE=${CODE: -3}   # تطبيع: لا يُقارَن إلا آخر ثلاثة أرقام
          echo "auth/v1/health → $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::خدمة المصادقة لا ترد ($CODE). المشروع متوقّف أو معطّل — استأنفه من لوحة Supabase."
            exit 1
          fi

      - name: نبضة ٢ — مسار الدخول يلمس القاعدة فعلًا
        run: |
          set -euo pipefail
          # بيانات وهمية صريحة: لا إنشاء حساب، ولا بيانات مستخدم حقيقية.
          CODE=$(curl -sS -m 30 -o /tmp/body -w '%{http_code}' \
            -X POST "${{ steps.cfg.outputs.url }}/auth/v1/token?grant_type=password" \
            -H "apikey: ${{ steps.cfg.outputs.key }}" \
            -H 'Content-Type: application/json' \
            -d '{"email":"keepalive-probe@example.invalid","password":"not-a-real-password"}' || true)
          CODE=${CODE: -3}   # تطبيع: لا يُقارَن إلا آخر ثلاثة أرقام
          echo "auth/v1/token → $CODE"
          cat /tmp/body || true
          echo
          case "$CODE" in
            400)
              # الردّ الصحيح: الخدمة حيّة واستعلمت القاعدة ورفضت بيانات وهمية.
              echo "✅ المشروع حيّ والقاعدة موصولة — النبضة احتُسبت."
              ;;
            500)
              echo "::error::«Database error querying schema» — الخدمة حيّة والقاعدة لا تزال تُستعاد أو معطوبة. أعد التشغيل بعد دقائق."
              exit 1
              ;;
            000)
              echo "::error::لا اتصال بالمشروع إطلاقًا — الأرجح أنه متوقّف (لا سجلّ DNS). استأنفه من لوحة Supabase."
              exit 1
              ;;
            *)
              echo "::error::ردّ غير متوقّع ($CODE) من مسار الدخول — افحص لوحة Supabase."
              exit 1
              ;;
          esac
