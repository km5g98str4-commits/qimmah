# ═══════════════════════════════════════════════════════════════════════════
# إعداد مشروع Supabase — [STAGING-COMMISSIONING §9]
# ═══════════════════════════════════════════════════════════════════════════
#
# ═══ العطل الذي يمنعه هذا الملف ═══
# طرفيات Supabase تعمل خلف بوّابة المنصّة، و**افتراضها التحقّق من JWT**. وسلة
# لا ترسل JWT قِمّة — ترسل توقيع HMAC في ترويسة خاصّة بها. فبلا الإعلان أدناه
# ترُدّ البوّابةُ **كل** تسليم من سلة بـ401 **قبل أن يعمل سطرٌ واحد من كودنا**:
# لا تحقّق توقيع، ولا سجلّ، ولا منحة — والمشتري يدفع ولا يصله شيء.
#
# ولا يظهر ذلك في أي اختبار عندنا: أطقمنا تنادي `contract.mjs` مباشرةً، فتتخطّى
# البوّابة التي ستردّ في الإنتاج. **عطلٌ يعيش بالضبط في الفجوة بين ما نختبره
# وما يُنشَر** — ولذلك يُكتب هنا لا في وثيقة.
#
# ⚠️ **وهذا ليس إضعافًا للأمان:** أصالة الطلب محسومة في `contract.mjs`
# بـHMAC-SHA256 على الجسم الخام ومقارنة ثابتة الزمن، **قبل أي كتابة**
# (`verifyAuthenticity` ثم `salla_ingest_event`). البوّابة هنا تحرس JWT
# مستخدمٍ لا وجود له في هذا المسار — فحراستها تمنع الشرعيّ ولا تمنع مزوِّرًا.
# ═══════════════════════════════════════════════════════════════════════════

[functions.salla-webhook]
# سلة تُوقّع بـHMAC ولا تحمل JWT. الأصالة تُفحص داخل الدالّة.
verify_jwt = false

[functions.qimmah-mailer]
# يُستدعى من داخل المنصّة بمفتاح الخدمة — لا متصفّح على هذا المسار.
verify_jwt = false

[functions.qimmah-gateway]
# ⚠️ **هذه وحدها تُبقيه `true` عمدًا.** البوّابة التجارية لا تقبل إلا متصفّحًا
# مصادَقًا: كل فعل خلفها (تجربة · استهلاك كود · مطالبة منحة) يشتقّ هويّته من
# `auth.uid()`، فطلبٌ بلا JWT لا معنى له أصلًا. وتركُ المنصّة تردّه **قبل**
# بلوغ كودنا يوفّر استدعاءً ويقلّص سطح الهجوم — طبقةٌ مجّانية لا تُنزَع.
verify_jwt = true
